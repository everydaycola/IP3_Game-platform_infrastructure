services:
  ai_player:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team2/ip2/ai-player/ai-player:latest
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=ai_postgres_local
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
      - RECOMMENDATION_API_URL=http://recommendation:8000
      - CHATBOT_API_URL=http://chatbot:8000
      - OLLAMA_BASE_URL=http://ollama_local:11434
    depends_on:
      - ai_postgres_local
      - ollama_local

  chatbot:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team2/ip2/chatbot/chatbot:latest
    ports:
      - "8001:8000"
    environment:
      - POSTGRES_HOST=ai_postgres_local
      - OLLAMA_BASE_URL=http://ollama_local:11434
    depends_on:
      - ai_postgres_local
      - ollama_local

  recommendation:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team2/ip2/recommendationsystem/recommendationsystem:latest
    ports:
      - "8002:8000"
    environment:
      - POSTGRES_HOST=ai_postgres_local
      - OLLAMA_EMBED_MODEL=mxbai-embed-large
      - OLLAMA_BASE_URL=http://ollama_local:11434
    depends_on:
      - ai_postgres_local
      - ollama_local

  ai_postgres_local:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama_local:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama_init:
    image: ollama/ollama:latest
    container_name: ollama_init
    environment:
      - OLLAMA_HOST=ollama_local:11434
    depends_on:
      - ollama_local
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        echo "Init-script gestart. Wachten op Ollama server ($OLLAMA_HOST)..."
        
        # 'until' blijft proberen totdat het commando succesvol is (exit code 0)
        until ollama list > /dev/null 2>&1; do
          echo "Server nog niet bereikbaar... we proberen het over 5 seconden opnieuw."
          sleep 5
        done

        echo "Verbinding gemaakt! Modellen worden gedownload..."
        
        echo ">>> Pulling gemma3:1b..."
        ollama pull gemma3:1b
        
        echo ">>> Pulling mxbai-embed-large..."
        ollama pull mxbai-embed-large
        
        echo "Klaar! Modellen zijn beschikbaar. Container stopt nu."

volumes:
  ollama_data:
  postgres_data: