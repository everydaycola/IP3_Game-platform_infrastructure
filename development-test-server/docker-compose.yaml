#      RABBIT_PASSWORD: password

  ai-player:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team2/ip2/ai-player/ai-player:latest
    container_name: ai-player
    ports:
      - '8000'
    networks:
      - app_network

  idp_mysql:
    image: mysql:9.0.1
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: 'root'
      MYSQL_DATABASE: 'keycloak'
      MYSQL_USER: 'keycloak'
      MYSQL_PASSWORD: 'password'
    expose:
      - '3306'
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  idp_keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: idp_keycloak
    environment:
      KEYCLOAK_ADMIN: 'admin'
      KEYCLOAK_ADMIN_PASSWORD: 'admin'
      KC_DB: 'mysql'
      KC_DB_URL_HOST: 'idp_mysql'
      KC_DB_URL_DATABASE: 'keycloak'
      KC_DB_USERNAME: 'keycloak'
      KC_DB_PASSWORD: 'password'
      KC_HTTP_ENABLED: 'true'
      KC_PROXY: 'edge'
      KC_HOSTNAME: 'http://localhost:8090/auth'
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_HTTPS: 'false'
      KC_HTTP_RELATIVE_PATH: '/auth'
    command: start --import-realm
    ports:
      - "8080:8080"
    depends_on:
      idp_mysql:
        condition: service_healthy
    networks:
      - app_network
    volumes:
      # make sure to delete any 'authorizationSettings' from realm-export.json
      - ./keycloak/import/realm-export.json:/opt/keycloak/data/import/FourteenGames-realm.json

  mq_rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    container_name: mq_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: 'user'
      RABBITMQ_DEFAULT_PASS: 'password'
    ports:
      - "5672:5672" #AMQP
      - "15672:15672" #MGMT
    networks:
      - app_network
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/
      - rabbitmq_log:/var/log/rabbitmq/
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql_data:
  rabbitmq_data:
  rabbitmq_log:
  postgresql_data:
  postgresql_pgdata:

networks:
  app_network:

# Reverse proxy only required for running dockerized locally.
configs:
  nginx-config:
    content: |
      events {}

      http {
        server {
          listen 80;
      
          location /auth/ {
            proxy_pass http://idp_keycloak:8080;
      
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }

          location /gamehosts/tic-tac-toe/ {
            proxy_pass http://tic-tac-toe-frontend/;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }
      
          location /gamehosts/go/ {
            proxy_pass http://go-frontend/;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }
      
          # location /gamehosts/chess/ {
          #   proxy_pass http://app_chessgame_front/;
          #   proxy_set_header Accept-Encoding "";
         
          #   # 1. Existing asset fixes (Keep these!)
          #   sub_filter 'src="/' 'src="/gamehosts/chess/';
          #   sub_filter 'href="/' 'href="/gamehosts/chess/';
          #   sub_filter '<head>' '<head><script>(function(){var p="/gamehosts/chess";var h=window.history;var oP=h.pushState;var oR=h.replaceState;h.pushState=function(s,t,u){if(u&&u.startsWith("/")&&!u.startsWith(p)){u=p+u;}return oP.apply(h,[s,t,u]);};h.replaceState=function(s,t,u){if(u&&u.startsWith("/")&&!u.startsWith(p)){u=p+u;}return oR.apply(h,[s,t,u]);};if(location.pathname.startsWith(p)){var r=location.pathname.substring(p.length)||"/";oR.apply(h,[null,null,r]);}})();</script>';
        
          #   sub_filter_once on;
          #   sub_filter_types text/html;
          # }
      
          # API's
          location /api/ {
            proxy_pass http://platform-backend:8080/api/;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }

          location /tic-tac-toe/api/ {
            proxy_pass http://tic-tac-toe-backend:8081/tic-tac-toe/api/;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }

          location /go/api/ {
            proxy_pass http://go-backend:8082/go/api/;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }
      
          # location /chess/api/ {
          #   proxy_pass http://app_chessgame_back:8083/chess/api/;
          #   proxy_set_header Host $$http_host;
          #   proxy_set_header X-Real-IP $$remote_addr;
          #   proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          #   proxy_set_header X-Forwarded-Proto $$scheme;
          # }

          # MAIN FRONTEND
          location / {
            proxy_pass http://platform-frontend:80;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }

        }
      }