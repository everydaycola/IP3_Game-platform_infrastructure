services:
  #Reverse proxy is only for local testing!
  proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    ports:
      - "8090:80"
    networks:
      - app_network
    configs:
      - source: nginx-config
        target: /etc/nginx/nginx.conf
    depends_on:
      - idp_keycloak
      - platform-frontend
      - tic-tac-toe-frontend
      - go-frontend
      - app-chessgame-front
      - platform-backend
      - tic-tac-toe-backend
      - go-backend
      - app-chessgame-back
      - chess-acl

  tic-tac-toe-frontend:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team14/games/tic-tac-toe/tic-tac-toe-frontend
    container_name: tic-tac-toe-frontend
    networks:
      - app_network
    environment:
      VITE_KC_URL: http://localhost:8090/auth
      VITE_KC_REALM: FourteenGames
      VITE_KC_CLIENT_ID: TTT-frontend
    ports:
      - "8091:80"

  go-frontend:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team14/games/go/go-frontend
    container_name: go-frontend
    networks:
      - app_network
    environment:
      VITE_BASENAME: /gamehosts/go
      VITE_KC_URL: http://localhost:8090/auth
      VITE_KC_REALM: FourteenGames
      VITE_KC_CLIENT_ID: go-frontend
    ports:
      - "8092:80"

  tic-tac-toe-backend:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team14/games/tic-tac-toe/tic-tac-toe-backend
    container_name: tic-tac-toe-backend
    expose:
      - "8081"
    networks:
      - app_network
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://platform-db:5432/postgres?currentSchema=tictactoe
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL-AUTO: update
      SPRING_JPA_SHOW-SQL: false
      SPRING_SQL_INIT_MODE: always
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: http://localhost:8090/auth/realms/FourteenGames
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://idp_keycloak:8080/auth/realms/FourteenGames/protocol/openid-connect/certs
      CORS_ALLOWED-ORIGINS: "http://localhost:8090"
      AI-CATALOG-API_URL: http://host.docker.internal:8000/api/tictactoe
      SPRING_RABBITMQ_ADDRESSES: "mq_rabbitmq:5672"
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
      SPRING_GAME_REGISTRATION_INTERNAL-GAME-URL: http://proxy/gamehosts/tic-tac-toe/
      SPRING_GAME_REGISTRATION_EXTERNAL-GAME-URL: http://localhost:8090/gamehosts/tic-tac-toe/
    depends_on:
      - platform-db
      - idp_keycloak

  go-backend:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team14/games/go/go-backend
    container_name: go-backend
    expose:
      - "8082"
    networks:
      - app_network
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://platform-db:5432/postgres?currentSchema=go
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL-AUTO: update
      SPRING_JPA_SHOW-SQL: false
      SPRING_SQL_INIT_MODE: always
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: http://localhost:8090/auth/realms/FourteenGames
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://idp_keycloak:8080/auth/realms/FourteenGames/protocol/openid-connect/certs
      CORS_ALLOWED-ORIGINS: "http://localhost:8090"
      SPRING_RABBITMQ_ADDRESSES: "mq_rabbitmq:5672"
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
      SPRING_GAME_REGISTRATION_INTERNAL-GAME-URL: http://proxy/gamehosts/go/
      SPRING_GAME_REGISTRATION_EXTERNAL-GAME-URL: http://localhost:8090/gamehosts/go/
      AI-CATALOG-API_URL: http://host.docker.internal:8000/api/go
    depends_on:
      platform-db:
        condition: service_started
      idp_keycloak:
        condition: service_started
      mq_rabbitmq:
        condition: service_healthy

  platform-frontend:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team14/platform/platform-frontend
    container_name: platform-frontend
    networks:
      - app_network
    environment:
      VITE_KC_URL: http://localhost:8090/auth
      VITE_KC_REALM: FourteenGames
      VITE_KC_CLIENT_ID: platform-frontend
    expose:
      - "80"

  platform-backend:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team14/platform/platform-backend
    container_name: platform-backend
    expose:
      - "8080"
    networks:
      - app_network
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://platform-db:5432/postgres?currentSchema=platform
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL-AUTO: update
      SPRING_JPA_SHOW-SQL: false
      SPRING_SQL_INIT_MODE: always
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: http://localhost:8090/auth/realms/FourteenGames
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://idp_keycloak:8080/auth/realms/FourteenGames/protocol/openid-connect/certs
      CORS_ALLOWED-ORIGINS: "http://localhost:8090"
      SPRING_RABBITMQ_ADDRESSES: mq_rabbitmq:5672
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
      AI-CHATBOT-API_URL: http://host.docker.internal:8001/api/chat
    depends_on:
      platform-db:
        condition: service_started
      idp_keycloak:
        condition: service_started
      mq_rabbitmq:
        condition: service_healthy

  platform-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'postgres'
      PGDATA: postgresql_pgdata
    ports:
      - '5443:5432'
    networks:
      - app_network
    volumes:
      - postgresql_data:/var/lib/postgresql
      - ./init-scripts/sql:/docker-entrypoint-initdb.d/

  chess-acl:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team14/games/chess-acl
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://platform-db:5432/postgres?currentSchema=chessacl
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL-AUTO: update
      SPRING_JPA_SHOW-SQL: false
      SPRING_SQL_INIT_MODE: always
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: http://localhost:8090/auth/realms/FourteenGames
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://idp_keycloak:8080/auth/realms/FourteenGames/protocol/openid-connect/certs
      CORS_ALLOWED-ORIGINS: "http://localhost:8090"
      SPRING_RABBITMQ_ADDRESSES: mq_rabbitmq:5672
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
      CHESSGAMEURL_URL: http://app-chessgame-back:8080/api
      SPRING_GAME_REGISTER_INTERNAL-URL: http://proxy/gamehosts/chess/
      SPRING_GAME_REGISTER_EXTERNAL-URL: http://localhost:8090/gamehosts/chess/
    expose:
      - '8083'
    networks:
      - app_network
    depends_on:
      platform-db:
        condition: service_started
      idp_keycloak:
        condition: service_started
      mq_rabbitmq:
        condition: service_healthy

  app-chessgame-front:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/demo-content/chessgame/front:latest
    container_name: app_chessgame_front
    ports:
      - '8093:80'
    networks:
      - app_network
    depends_on:
      platform-db:
        condition: service_started
      mq_rabbitmq:
        condition: service_healthy

  app-chessgame-back:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/demo-content/chessgame/back:latest
    container_name: app_chessgame_back
    expose:
      - '8080'
    networks:
      - app_network
    depends_on:
      platform-db:
        condition: service_started
      mq_rabbitmq:
        condition: service_healthy
    environment:
      GAME_REGISTRATION_ID: 33333333-3333-3333-3333-333333333333
      DATASOURCE_URL: jdbc:postgresql://platform-db:5432/postgres?currentSchema=chess
      DATASOURCE_USER: user
      DATASOURCE_PASSWORD: password
      RABBIT_HOST: mq_rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: user
      RABBIT_PASSWORD: password

  idp_mysql:
    image: mysql:9.0.1
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: 'root'
      MYSQL_DATABASE: 'keycloak'
      MYSQL_USER: 'keycloak'
      MYSQL_PASSWORD: 'password'
    expose:
      - '3306'
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  idp_keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: idp_keycloak
    environment:
      KEYCLOAK_ADMIN: 'admin'
      KEYCLOAK_ADMIN_PASSWORD: 'admin'
      KC_DB: 'mysql'
      KC_DB_URL_HOST: 'idp_mysql'
      KC_DB_URL_DATABASE: 'keycloak'
      KC_DB_USERNAME: 'keycloak'
      KC_DB_PASSWORD: 'password'
      KC_HTTP_ENABLED: 'true'
      KC_PROXY: 'edge'
      KC_HOSTNAME: 'http://localhost:8090/auth'
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_HTTPS: 'false'
      KC_HTTP_RELATIVE_PATH: '/auth'
    command: start --import-realm
    ports:
      - "8080:8080"
    depends_on:
      idp_mysql:
        condition: service_healthy
    networks:
      - app_network
    volumes:
      # make sure to delete any 'authorizationSettings' from realm-export.json
      - ./keycloak/import/realm-export.json:/opt/keycloak/data/import/FourteenGames-realm.json

  mq_rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    container_name: mq_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: 'user'
      RABBITMQ_DEFAULT_PASS: 'password'
    ports:
      - "5672:5672" #AMQP
      - "15672:15672" #MGMT
    networks:
      - app_network
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/
      - rabbitmq_log:/var/log/rabbitmq/
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql_data:
  rabbitmq_data:
  rabbitmq_log:
  postgresql_data:
  postgresql_pgdata:

networks:
  app_network:

# Reverse proxy only required for running dockerized locally.
configs:
  nginx-config:
    content: |
      events {}

      http {
        server {
          listen 80;
      
          location /auth/ {
            proxy_pass http://idp_keycloak:8080;
      
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }

          location /gamehosts/tic-tac-toe/ {
            proxy_pass http://tic-tac-toe-frontend/;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }
      
          location /gamehosts/go/ {
            proxy_pass http://go-frontend/;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }
      
          #  BLACK BOX CHESS APP (Subpath Rewrite Magic)
          location /gamehosts/chess/ {
            proxy_pass http://app-chessgame-front/;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
      
            # Subpath Rewriting Logic
            proxy_set_header Accept-Encoding ""; # Force uncompressed to allow rewriting
      
            # CRITICAL: We enable * to ensure JS files are filtered regardless of backend MIME type
            sub_filter_types *;
      
            # 1. Fix HTML references (HTML attributes)
            sub_filter 'src="/'  'src="/gamehosts/chess/';
            sub_filter 'href="/' 'href="/gamehosts/chess/';
            sub_filter 'action="/' 'action="/gamehosts/chess/';
      
            # 2. Fix JS React Router Logic
            #    We use multiple variations to catch minified/unminified formats.
            #    The "*" type above ensures these actually run on the JS bundle.
      
            sub_filter 'path:"/"' 'path:"/gamehosts/chess/"'; 
            sub_filter 'path: "/"' 'path: "/gamehosts/chess/"';
            sub_filter "path:'/'" "path:'/gamehosts/chess/'";
            sub_filter "path: '/'" "path: '/gamehosts/chess/'";

            # Catch-all routes often used in React Router
            sub_filter 'path:"*"' 'path:"/gamehosts/chess/*"';

            # Fix generic absolute paths in routes (e.g. path: "/login")
            sub_filter 'path:"/' 'path:"/gamehosts/chess/';
            sub_filter "path:'/" "path:'/gamehosts/chess/";

            # Fix Navigation Links (e.g., to: "/")
            sub_filter 'to:"/"' 'to:"/gamehosts/chess/"';
            sub_filter 'to: "/"' 'to: "/gamehosts/chess/"';
            sub_filter "to:'/'" "to:'/gamehosts/chess/'";
      
            # Fix generic absolute paths in links
            sub_filter 'to:"/' 'to:"/gamehosts/chess/';
            sub_filter "to:'/" "to:'/gamehosts/chess/";
      
            # 3. Fix API calls in JS files
            sub_filter '"/api' '"/gamehosts/chess/api';
            sub_filter "'/api" "'/gamehosts/chess/api";
      
            sub_filter_once off;
          }
      
          location /gamehosts/chess/api/ {
             proxy_pass http://app-chessgame-back:8080/api/;
      
             proxy_set_header Host $$http_host;
             proxy_set_header X-Real-IP $$remote_addr;
             proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $$scheme;
          }
      
          # API's
          location /api/ {
            proxy_pass http://platform-backend:8070/api/;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }

          location /tic-tac-toe/api/ {
            proxy_pass http://tic-tac-toe-backend:8081/tic-tac-toe/api/;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }

          location /go/api/ {
            proxy_pass http://go-backend:8082/go/api/;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }
      
          # MAIN FRONTEND
          location / {
            proxy_pass http://platform-frontend:80;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }

        }
      }