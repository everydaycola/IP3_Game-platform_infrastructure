services:
  #Reverse proxy is only for local testing!
  proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    ports:
      - "8090:80"
    networks:
      - app_network
    configs:
      - source: nginx-config
        target: /etc/nginx/nginx.conf
    depends_on:
      - idp_keycloak
      - platform-frontend
      - tic-tac-toe-frontend
      - go-frontend
#      - app_chessgame_front
      - platform-backend
      - tic-tac-toe-backend
      - go-backend
#      - app_chessgame_back

  tic-tac-toe-frontend:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team14/games/tic-tac-toe/tic-tac-toe-frontend
    container_name: tic-tac-toe-frontend
    networks:
      - app_network
    environment:
      VITE_KC_URL: http://localhost:8090/auth
      VITE_KC_REALM: FourteenGames
      VITE_KC_CLIENT_ID: TTT-frontend
    ports:
      - "8091:80"

  go-frontend:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team14/games/go/go-frontend
    container_name: go-frontend
    networks:
      - app_network
    environment:
      VITE_BASENAME: /gamehosts/go
      VITE_KC_URL: http://localhost:8090/auth
      VITE_KC_REALM: FourteenGames
      VITE_KC_CLIENT_ID: go-frontend
    ports:
      - "8092:80"

  tic-tac-toe-backend:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team14/games/tic-tac-toe/tic-tac-toe-backend
    container_name: tic-tac-toe-backend
    expose:
      - "8081"
    networks:
      - app_network
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://platform-db:5432/postgres?currentSchema=tictactoe
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL-AUTO: update
      SPRING_JPA_SHOW-SQL: false
      SPRING_SQL_INIT_MODE: always
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: http://localhost:8090/auth/realms/FourteenGames
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://idp_keycloak:8080/auth/realms/FourteenGames/protocol/openid-connect/certs
      CORS_ALLOWED-ORIGINS: "http://localhost:8090"
      AI-CATALOG-API_URL: http://ai-player:8000/api/tictactoe
    depends_on:
      - platform-db
      - idp_keycloak

  go-backend:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team14/games/go/go-backend
    container_name: go-backend
    expose:
      - "8082"
    networks:
      - app_network
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://platform-db:5432/postgres?currentSchema=go
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL-AUTO: update
      SPRING_JPA_SHOW-SQL: false
      SPRING_SQL_INIT_MODE: always
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: http://localhost:8090/auth/realms/FourteenGames
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://idp_keycloak:8080/auth/realms/FourteenGames/protocol/openid-connect/certs
      CORS_ALLOWED-ORIGINS: "http://localhost:8090"
      SPRING_RABBITMQ_ADDRESSES: "mq_rabbitmq:5672"
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
      SPRING_RABBITMQ_FOURTEENGAMES_INTERNAL-GAME-URL: http://proxy/gamehosts/go/
      SPRING_RABBITMQ_FOURTEENGAMES_EXTERNAL-GAME-URL: http://localhost:8090/gamehosts/go/
      AI-CATALOG-API_URL: http://ai-player:8000/api/go
    depends_on:
      platform-db:
        condition: service_started
      idp_keycloak:
        condition: service_started
      mq_rabbitmq:
        condition: service_healthy

  platform-frontend:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team14/platform/platform-frontend
    container_name: platform-frontend
    networks:
      - app_network
    environment:
      VITE_KC_URL: http://localhost:8090/auth
      VITE_KC_REALM: FourteenGames
      VITE_KC_CLIENT_ID: platform-frontend
    expose:
      - "80"

  platform-backend:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team14/platform/platform-backend
    container_name: platform-backend-image
    expose:
      - "8080"
    networks:
      - app_network
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://platform-db:5432/postgres?currentSchema=platform
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL-AUTO: update
      SPRING_JPA_SHOW-SQL: false
      SPRING_SQL_INIT_MODE: always
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: http://localhost:8090/auth/realms/FourteenGames
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://idp_keycloak:8080/auth/realms/FourteenGames/protocol/openid-connect/certs
      CORS_ALLOWED-ORIGINS: "http://localhost:8090"
      SPRING_RABBITMQ_ADDRESSES: mq_rabbitmq:5672
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
    depends_on:
      platform-db:
        condition: service_started
      idp_keycloak:
        condition: service_started
      mq_rabbitmq:
        condition: service_healthy

  platform-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'postgres'
      PGDATA: postgresql_pgdata
    ports:
      - '5443:5432'
    networks:
      - app_network
    volumes:
      - postgresql_data:/var/lib/postgresql
      - ./init-scripts/sql:/docker-entrypoint-initdb.d/

